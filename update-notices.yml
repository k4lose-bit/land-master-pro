# 매일 아침(한국시간 06:30) 고시·공고를 자동 수집해 data/notices.json 갱신
# GitHub 저장소에 이 폴더(site/ 내용)를 올리면 자동으로 작동합니다.
name: update-notices

on:
  schedule:
    - cron: "30 21 * * *"   # UTC 21:30 = KST 06:30
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Collect notices
        run: python crawler/collect_notices.py

      - name: Commit if changed
        run: |
          git config user.name "notice-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/notices.json
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore: 고시·공고 자동 갱신 $(date +'%Y-%m-%d')"
          git push
